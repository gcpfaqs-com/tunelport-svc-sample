services:
  tunelport-svc-totems-postgres:
    image: postgres:17
    container_name: tunelport-svc-totems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tunelport-svc-totems_test
    ports:
      - "5431:5432"
    volumes:
      - tunelport-svc-totems_postgres_data:/var/lib/postgresql/data

volumes:
  tunelport-svc-totems_postgres_data:
